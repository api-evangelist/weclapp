aid: weclapp
url: https://raw.githubusercontent.com/api-evangelist/weclapp/refs/heads/main/apis.yml
name: weclapp
kind: company
description: >-
  weclapp is a German cloud ERP / CRM / commerce platform for small and
  mid-sized businesses, combining CRM, sales, order management, accounting,
  inventory / warehouse management, purchasing, and e-commerce in one SaaS
  suite. Every weclapp tenant exposes a documented REST API at
  https://<tenant>.weclapp.com/webapp/api/v1/ with a live Swagger, covering
  150+ business entities - parties (customers, suppliers, contacts, leads),
  articles, sales orders, quotations, sales invoices, shipments, purchase
  orders, warehouses, and more. Authentication is a per-user API token sent in
  the AuthenticationToken request header.
