openapi: 3.2.0
info:
  title: weclapp REST Quotation API
  description: weclapp is a German cloud ERP / CRM / commerce platform.
  version: v1
  contact:
    name: weclapp
    url: https://www.weclapp.com/api/
servers:
- url: https://{tenant}.weclapp.com/webapp/api/v1
  description: Per-tenant weclapp REST API (v1). Replace {tenant} with your weclapp subdomain.
  variables:
    tenant:
      default: your-tenant
      description: Your weclapp tenant subdomain (for example, the "acme" in acme.weclapp.com).
security:
- authenticationToken: []
tags:
- name: Quotation
  description: Sales quotations / quotes.
paths:
  /quotation:
    get:
      operationId: getQuotations
      tags:
      - Quotation
      summary: List quotations
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Properties'
      - $ref: '#/components/parameters/AdditionalProperties'
      responses:
        '200':
          description: A page of quotations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createQuotation
      tags:
      - Quotation
      summary: Create a quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quotation'
      responses:
        '201':
          description: The created quotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /quotation/count:
    get:
      operationId: countQuotations
      tags:
      - Quotation
      summary: Count quotations
      responses:
        '200':
          description: The count result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /quotation/id/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      operationId: getQuotationById
      tags:
      - Quotation
      summary: Get a quotation
      responses:
        '200':
          description: The requested quotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateQuotation
      tags:
      - Quotation
      summary: Update a quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Quotation'
      responses:
        '200':
          description: The updated quotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteQuotation
      tags:
      - Quotation
      summary: Delete a quotation
      responses:
        '204':
          description: The quotation was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    OrderItem:
      type: object
      description: A line item on an order, quotation, or invoice. Modeled subset.
      properties:
        id:
          type: string
        articleId:
          type: string
        articleNumber:
          type: string
        quantity:
          type: string
          description: Decimal quantity serialized as a string.
        unitPrice:
          type: string
        title:
          type: string
    QuotationList:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/Quotation'
    Error:
      type: object
      description: Error envelope (modeled; consult live Swagger for the exact shape).
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              message:
                type: string
    Quotation:
      type: object
      description: Sales quotation. Modeled subset of documented fields.
      properties:
        id:
          type: string
        quotationNumber:
          type: string
        customerId:
          type: string
        status:
          type: string
        quotationDate:
          type: integer
          format: int64
        currencyId:
          type: string
        quotationItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        createdDate:
          type: integer
          format: int64
        lastModifiedDate:
          type: integer
          format: int64
    CountResult:
      type: object
      properties:
        result:
          type: integer
          description: The number of matching entities.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number for paginated list results.
      schema:
        type: integer
        minimum: 1
        default: 1
    Sort:
      name: sort
      in: query
      required: false
      description: Property to sort by. Prefix with a minus sign for descending order (for example, `-createdDate`).
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of results per page.
      schema:
        type: integer
        minimum: 1
        default: 100
    Properties:
      name: properties
      in: query
      required: false
      description: Comma-separated list of properties to include in the response.
      schema:
        type: string
    AdditionalProperties:
      name: additionalProperties
      in: query
      required: false
      description: Comma-separated list of computed / related properties to include in the response.
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      description: The unique identifier of the entity.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid AuthenticationToken.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request was invalid (for example, an unknown or invalid property).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested entity was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    authenticationToken:
      type: apiKey
      in: header
      name: AuthenticationToken
      description: 'API token issued per weclapp user under "My Settings > API". Sent in the `AuthenticationToken` request header. Requests must also send `Accept: application/json`; `POST` and `PUT` requests must send `Content-Type: application/json`.'
