components:
  securitySchemes:
    authenticationToken:
      type: apiKey
      in: header
      name: AuthenticationToken
      description: >-
        API token issued per weclapp user under "My Settings > API". Sent in the
        `AuthenticationToken` request header. Requests must also send
        `Accept: application/json`; `POST` and `PUT` requests must send
        `Content-Type: application/json`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The unique identifier of the entity.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number for paginated list results.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of results per page.
      schema:
        type: integer
        minimum: 1
        default: 100
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Property to sort by. Prefix with a minus sign for descending order
        (for example, `-createdDate`).
      schema:
        type: string
    Properties:
      name: properties
      in: query
      required: false
      description: Comma-separated list of properties to include in the response.
      schema:
        type: string
    AdditionalProperties:
      name: additionalProperties
      in: query
      required: false
      description: Comma-separated list of computed / related properties to include in the response.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request was invalid (for example, an unknown or invalid property).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid AuthenticationToken.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested entity was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Error envelope (modeled; consult live Swagger for the exact shape).
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              message:
                type: string
    CountResult:
      type: object
      properties:
        result:
          type: integer
          description: The number of matching entities.
    Customer:
      type: object
      description: Customer master data. Modeled subset of documented fields.
      properties:
        id:
          type: string
        customerNumber:
          type: string
        company:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        partyType:
          type: string
          enum: [ORGANIZATION, PERSON]
        currencyId:
          type: string
