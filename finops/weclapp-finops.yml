meters:
- name: user_seats
  description: Named user seats subscribed, per edition, billed per month (the primary cost driver).
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - edition
- name: onboarding
  description: One-time onboarding / implementation services.
  unit: engagement
  aggregation: sum
  dimensions:
  - account
- name: premium_support
  description: Optional premium support package fees.
  unit: package
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track subscribed seats per edition and any add-on / support fees; API usage itself is not separately billed.
- name: Allocation
  description: Map seats to teams / cost centers by edition so subscription spend is attributable.
- name: Optimization
  description: Use the REST API to automate data flows and integrations so fewer seats are needed; prefer annual billing; right-size the edition to the modules actually used.
- name: Accountability
  description: Review seat counts and edition mix each renewal against actual usage; reclaim unused seats.
