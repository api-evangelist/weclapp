description: >-
  FinOps view of weclapp spend. weclapp is a per-seat SaaS subscription billed in
  EUR per named user per month, by edition (CRM, ERP Services, ERP Trade) with
  custom/enterprise options; annual billing is cheaper than monthly. The REST API
  is included in the subscription rather than metered separately, so the dominant
  cost driver is seat count and edition rather than API call volume. Non-seat
  costs are typically onboarding / implementation and premium support. Because
  cost scales with users (not requests), the API is a way to reduce total cost of
  ownership - automating data entry and integrations so fewer seats do more work.
notes: >-
  Per-edition rates are approximate and not reconciled here; verify on the
  weclapp pricing page. There is no separate per-request API charge documented -
  API usage is bounded by throttling and the tenant plan, not billed per call.
